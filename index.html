<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>Aziz Academy</title>
  <style>
    body {
      margin: 0;
      font-family: 'Tahoma', sans-serif;
      background: linear-gradient(135deg, #111, #333);
      color: #fff;
    }

    /* شريط متحرك */
    .marquee {
      background-color: gold;
      color: black;
      font-weight: bold;
      padding: 10px 0;
      overflow: hidden;
      white-space: nowrap;
    }
    .marquee span {
      display: inline-block;
      padding-left: 100%;
      animation: scroll 15s linear infinite;
    }
    @keyframes scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }

    header {
      background-color: rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 40px;
      position: relative;
    }
    header img {
      width: 70px;
      height: auto;
    }
    nav a {
      color: white;
      margin: 0 15px;
      text-decoration: none;
      font-weight: bold;
    }
    nav a:hover {
      color: gold;
    }

    .hero {
      background: url('pattern.png') repeat; /* زخرفة خلفية */
      text-align: center;
      padding: 100px 20px;
    }
    .hero h1 {
      font-size: 48px;
      color: gold;
    }
    .hero p {
      font-size: 20px;
    }

    .section {
      padding: 60px 20px;
      text-align: center;
      background-color: rgba(255,255,255,0.05);
      margin: 20px;
      border-radius: 10px;
    }
    .section h2 {
      color: gold;
      margin-bottom: 20px;
    }

    footer {
      background-color: #111;
      color: #aaa;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>
  <!-- شريط متحرك -->
  <div class="marquee">
    <span>Aziz Academy — تهنى على الميدسين — Science Experimental</span>
  </div>

  <!-- Header -->
  <header>
    <img src="Image1.png" alt="Aziz Academy Logo">
    <nav>
      <a href="#">الرئيسية</a>
      <a href="#">من نحن؟</a>
      <a href="#">البرامج</a>
      <a href="#">الموارد</a>
      <a href="#">اتصل بنا</a>
    </nav>
  </header>

  <!-- Hero -->
  <div class="hero">
    <h1>Aziz Academy</h1>
    <p>منصة تعليمية حديثة تجمع بين الطب والعلم والمعرفة.</p>
  </div>

  <!-- Section -->
  <div class="section">
    <h2>من نحن؟</h2>
    <p>أكاديمية عزيز هي فضاء تعليمي حديث يهدف إلى تكوين الطلبة في المجالات الطبية والعلمية، مع موارد رقمية ودروس تفاعلية.</p>
  </div>
